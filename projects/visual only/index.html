<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Objects</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="container">

        <div class="object perfume">
            <img src="imgs/perfume.png" alt="Perfume">
            <p class="frequency">4 DAYS A WEEK</p>
        </div>

        <div class="object airpods">
            <img src="imgs/airpods.png" alt="AirPods">
            <p class="frequency">EVERY DAY</p>
        </div>

        <div class="object sunglasses">
            <img src="imgs/sunglasses.png" alt="Sunglasses">
            <p class="frequency">ONCE A WEEK</p>
        </div>

        <div class="object eyedrops">
            <img src="imgs/eyedrops.png" alt="Eye Drops">
            <p class="frequency">2 TIMES A WEEK</p>
        </div>

        <div class="object wallet">
            <img src="imgs/wallet.png" alt="Wallet">
            <p class="frequency">EVERY DAY</p>
        </div>

        <div class="object pen">
            <img src="imgs/pen.png" alt="Pen">
            <p class="frequency">5 DAYS A WEEK</p>
        </div>

        <div class="object lipbalm">
            <img src="imgs/lipbalm.png" alt="Lip Balm">
            <p class="frequency">3–5 TIMES A WEEK</p>
        </div>

        <div class="object camera">
            <img src="imgs/camera.png" alt="Camera">
            <p class="frequency">2 TIMES A WEEK</p>
        </div>

        <div class="object candle">
            <img src="imgs/candle.png" alt="Candle">
            <p class="frequency">RARELY</p>
        </div>

    </div>

</body>
</html>
